# Project configuration for SAMA7D65 Curiosity with AC40T08A MIPI-DSI LCD
#
# This configuration replaces LVDSC with DSI for the MIPI display.
# Use with app_ac40t08a.overlay

# Enable Logging
CONFIG_LOG=y
CONFIG_DISPLAY_LOG_LEVEL_INF=y

# Enable Display Subsystem
CONFIG_DISPLAY=y

# Enable XLCDC driver
CONFIG_DISPLAY_MICROCHIP_SAM_XLCDC=y
CONFIG_DISPLAY_MICROCHIP_SAM_XLCDC_LAYER=y

# Enable DSI bridge driver (instead of LVDSC)
CONFIG_DISPLAY_MICROCHIP_SAM_DSI=y

# Kernel VM must cover heap (16MB) + kernel code/data/stacks
CONFIG_KERNEL_VM_SIZE=0x2000000

# Main thread stack for LVGL rendering (default is too small)
CONFIG_MAIN_STACK_SIZE=16384

# Enable double-buffering for tear-free display
CONFIG_MICROCHIP_SAM_XLCDC_DOUBLE_BUFFER=y

# Heap for dynamic framebuffer allocation
# AC40T08A: 720x1280 RGBA8888 x 2 buffers = ~7.4MB
CONFIG_HEAP_MEM_POOL_SIZE=8388608

# FLEXCOM MFD (sets FLEX_MR to TWI/SPI/USART mode)
CONFIG_MFD=y

# Panel power regulator (PB18 enable before touch init)
CONFIG_REGULATOR=y

# Input / Touch
CONFIG_INPUT=y
CONFIG_INPUT_MODE_SYNCHRONOUS=y

# Microchip MTCH driver
CONFIG_INPUT_MICROCHIP_MTCH=y
CONFIG_INPUT_MICROCHIP_MTCH_PERIOD_MS=5

# LVGL (zero-copy: LVGL owns buffers, driver pointer-swaps DMA address)
CONFIG_LVGL=y
CONFIG_LV_Z_FULL_REFRESH=y
CONFIG_LV_Z_VDB_SIZE=100
CONFIG_LV_Z_DOUBLE_VDB=y
CONFIG_LV_Z_FLUSH_THREAD=y
CONFIG_LV_Z_MEM_POOL_SIZE=1048576
CONFIG_LV_COLOR_DEPTH_32=y
CONFIG_LV_DPI_DEF=320
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_20=y
CONFIG_LV_FONT_MONTSERRAT_28=y
